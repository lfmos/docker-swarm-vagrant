version: "3.8"

services:
  web:
    image: nginxinc/nginx-unprivileged:1.30.4-alpine-slim

    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: ingress

    networks:
      - swarm-demo

    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:8080/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    deploy:
      mode: replicated

      replicas: 3

      placement:
        constraints:
          - node.role == worker
        max_replicas_per_node: 1

      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
        failure_action: rollback

      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first

      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s

      resources:
        reservations:
          cpus: "0.05"
          memory: 32M
        limits:
          cpus: "0.25"
          memory: 128M


networks:
  swarm-demo:
    driver: overlay